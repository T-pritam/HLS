
# ── hls on himlifeschool.com → container (10.253.144.40:3008, pm2 hls) ──
# Canonical name is the bare domain (metadataBase and sitemap say https://himlifeschool.com).
# www redirects to it. DNS at GoDaddy: A @ and A www → 187.127.145.209.
# X-Forwarded-For is set to the real visitor address so it cannot be faked (the
# booking API rate-limits by the first X-Forwarded-For entry).
# As on the front machine after certbot (2026-11-12). Cert: /etc/letsencrypt/live/himlifeschool.com, auto-renewed.
server {
    server_name www.himlifeschool.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://himlifeschool.com$request_uri; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/himlifeschool.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/himlifeschool.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name himlifeschool.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 10m;

    location / {
        proxy_pass         http://10.253.144.40:3008;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/himlifeschool.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/himlifeschool.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = himlifeschool.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name himlifeschool.com;
    return 404; # managed by Certbot


}
server {
    if ($host = www.himlifeschool.com) {
        return 301 https://himlifeschool.com$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.himlifeschool.com;
    return 404; # managed by Certbot


}
