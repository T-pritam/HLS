# Redis for the HLS booking site only (leads and bookings). Separate from the
# shared Redis on 6379. Reached through /opt/hls-redis/redis-http.mjs (port 8079).
bind 127.0.0.1
port 6380
protected-mode yes
dir /var/lib/redis-hls
dbfilename dump.rdb
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
logfile ""
