
# ── hls (HIM LIFE SCHOOL site) → container (10.253.144.40:3008, pm2 hls) ──
# Temporary name until himlifeschool.com is handed over. DNS: Cloudflare, A hls, DNS only.
# X-Forwarded-For is set to the real visitor address so it cannot be faked (the
# booking API rate-limits by the first X-Forwarded-For entry).
server {
    listen 80;
    server_name hls.tach21.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name hls.tach21.com;
    ssl_certificate /etc/letsencrypt/live/hls.tach21.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hls.tach21.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://10.253.144.40:3008;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
